2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.5.5c-.2.2-.3.4-.1.7.2.3.9 1.5 2 2.4 1.4 1.2 2.5 1.6 2.8 1.7.3.1.5.1.7-.1l1-1.2c.2-.3.4-.2.7-.1l2.1 1c.3.2.5.3.6.4 0 .2 0 .7-.2 1.1Z\"><\/path><\/svg>\n    WhatsApp: pide tu cuota\n  <\/a>\n<\/sc-if>\n<\/aside>\n<sc-if value=\"{{ paletaSwitcher }}\">\n<aside aria-label=\"Selector de paleta de colores del prototipo\" style=\"position:fixed;z-index:70;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;background-color:var(--surface);border:1px solid var(--border);border-top:2px solid var(--accent-line);box-shadow:0 6px 20px rgba(0,0,0,.2);padding:10px 12px;display:flex;flex-direction:column;gap:8px\">\n  <p style=\"margin:0;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10px;letter-spacing:.12em;color:var(--text-muted)\">PALETA · PROTOTIPO<\/p>\n  <div style=\"display:flex;gap:8px\">\n    <sc-for list=\"{{ paletas }}\" as=\"pa\" hint-placeholder-count=\"3\">\n      <button sc-camel-on-click=\"{{ pa.pick }}\" aria-pressed=\"{{ pa.sel }}\" aria-label=\"{{ pa.aria }}\" title=\"{{ pa.nombre }}\" style=\"min-width:44px;min-height:44px;padding:5px;background-color:var(--surface);border:2px solid {{ pa.borde }};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px\">\n        <span aria-hidden=\"true\" style=\"display:block;width:26px;height:13px;background:{{ pa.c1 }}\"><\/span>\n        <span aria-hidden=\"true\" style=\"display:block;width:26px;height:13px;background:{{ pa.c2 }}\"><\/span>\n      <\/button>\n    <\/sc-for>\n  <\/div>\n<\/aside>\n<\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;numeroWhatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;584127230632&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contacto&quot;},&quot;temaInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;claro&quot;,&quot;oscuro&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Interfaz&quot;},&quot;botonFlotante&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interfaz&quot;}}\">\nclass Component extends DCLogic {\n  state = { theme: 'light', producto: null, rango: null, ctaZona: false, paleta: 'oro', temaSwitcher: false };\n  componentDidMount() {\n    let t = null;\n    try { t = localStorage.getItem('nd-theme'); } catch (e) {}\n    if (!t) {\n      const pref = this.props.temaInicial ?? 'auto';\n      t = pref === 'claro' ? 'light' : pref === 'oscuro' ? 'dark'\n        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');\n    }\n    this.applyTheme(t, false);\n    this.initFloatingCta();\n    let pal = null;\n    try { pal = localStorage.getItem('nd-palette'); } catch (e) {}\n    if (!['oro', 'vinotinto', 'petroleo'].includes(pal)) pal = 'oro';\n    this.applyPalette(pal, false);\n    this.setState({ temaSwitcher: /[?&]tema(=|&|$)/.test(location.search) });\n    this._onMove = (ev) => {\n      const card = ev.target.closest && ev.target.closest('div[data-reveal]');\n      if (!card) return;\n      const r = card.getBoundingClientRect();\n      card.style.setProperty('--mx', Math.round(ev.clientX - r.left) + 'px');\n      card.style.setProperty('--my', Math.round(ev.clientY - r.top) + 'px');\n    };\n    document.addEventListener('pointermove', this._onMove, { passive: true });\n    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {\n      this._ioCifra = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (!en.isIntersecting) return;\n          this._ioCifra.unobserve(en.target);\n          const fin = parseInt(en.target.textContent, 10);\n          if (!fin) return;\n          const t0 = performance.now();\n          const tick = (now) => {\n            const k = Math.min(1, (now - t0) / 900);\n            en.target.textContent = String(Math.round(fin * (1 - Math.pow(1 - k, 3))));\n            if (k < 1) requestAnimationFrame(tick);\n          };\n          requestAnimationFrame(tick);\n        });\n      }, { threshold: 0.6 });\n      document.querySelectorAll('.nd-cifra').forEach((el) => this._ioCifra.observe(el));\n    }\n    if (!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {\n      const els = document.querySelectorAll('[data-reveal]');\n      this._io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) { en.target.setAttribute('data-reveal', 'in'); this._io.unobserve(en.target); }\n        });\n      }, { threshold: 0.12 });\n      els.forEach((el) => {\n        const r = el.getBoundingClientRect();\n        if (r.top > innerHeight) { el.setAttribute('data-reveal', 'pending'); this._io.observe(el); }\n      });\n    }\n  }\n  componentWillUnmount() { if (this._io) this._io.disconnect(); if (this._ioCta) this._ioCta.disconnect(); if (this._ioCifra) this._ioCifra.disconnect(); if (this._onMove) document.removeEventListener('pointermove', this._onMove); }\n  initFloatingCta() {\n    if (!('IntersectionObserver' in window)) return;\n    this._zonas = new Set();\n    this._ioCta = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (en.isIntersecting) this._zonas.add(en.target); else this._zonas.delete(en.target);\n      });\n      this.setState({ ctaZona: this._zonas.size > 0 });\n    }, { threshold: 0.2 });\n    document.querySelectorAll('#ubicacion, #cierre').forEach((z) => this._ioCta.observe(z));\n  }\n  withViewTransition(mutate) {\n    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      document.startViewTransition(mutate);\n    } else { mutate(); }\n  }\n  applyPalette(p, persist) {\n    this.withViewTransition(() => {\n      if (p === 'oro') document.documentElement.removeAttribute('data-palette');\n      else document.documentElement.setAttribute('data-palette', p);\n    });\n    this.setState({ paleta: p });\n    if (persist) { try { localStorage.setItem('nd-palette', p); } catch (e) {} }\n  }\n  applyTheme(t, persist) {\n    if (this.state && this.state.theme !== t && document.documentElement.hasAttribute('data-theme')) {\n      this.withViewTransition(() => document.documentElement.setAttribute('data-theme', t));\n    } else {\n      document.documentElement.setAttribute('data-theme', t);\n    }\n    this.setState({ theme: t });\n    if (persist) { try { localStorage.setItem('nd-theme', t); } catch (e) {} }\n  }\n  wa(msg) { return 'https://wa.me/' + (this.props.numeroWhatsapp ?? '584127230632') + '?text=' + encodeURIComponent(msg); }\n  renderVals() {\n    const { theme, producto, rango, ctaZona, paleta, temaSwitcher } = this.state;\n    const isDark = theme === 'dark';\n    const waGeneral = this.wa('Hola Nexus Dinamys, vengo de la página web y quiero información de los planes.');\n    const planes = [\n      { nombre: 'Moto KADI 0 km', cifra: '135', sinCifra: false, etiqueta: 'al mes · referencia tasa euro', faltante: null,\n        destacada: 'Inicial de $500',\n        items: ['Aprobación en tiempo récord: hasta en 2 días', 'Requiere gastos administrativos', 'Cupos limitados por semana'],\n        boton: 'Quiero mi moto KADI', aria: 'Escribir por WhatsApp por la moto KADI 0 km',\n        href: this.wa('Hola Nexus Dinamys, vengo de la web. Quiero la moto KADI 0 km con inicial de $500 y cuota de $135 al mes. ¿Me confirman los requisitos y si hay cupos esta semana?') },\n      { nombre: 'Equipa tu casa', cifra: null, sinCifra: true, etiqueta: 'quincenal · cotizado a tasa BCV',\n        faltante: '[DATO FALTANTE: monto de cuota quincenal e inicial de electrodomésticos]',\n        destacada: 'Uno o varios artículos en el mismo plan',\n        items: ['Neveras, congeladores, lavadoras y cocinas Daewoo', 'Licuadora, air fryer, cafetera, arepera, sandwichera y olla arrocera', 'La fecha de entrega se define por sorteo entre los participantes'],\n        boton: 'Quiero equipar mi casa', aria: 'Escribir por WhatsApp por electrodomésticos en cuotas',\n        href: this.wa('Hola Nexus Dinamys, vengo de la web. Quiero equipar mi casa con cuotas quincenales. Me interesa: (nevera / congelador / lavadora / cocina / electrodomésticos pequeños). ¿Cuál es la cuota y cuándo abre el próximo grupo?') },\n      { nombre: 'Susu de iPhone', cifra: null, sinCifra: true, etiqueta: 'quincenal · cotizado a tasa BCV',\n        faltante: '[DATO FALTANTE: cuota quincenal del Susu de iPhone por modelo]',\n        destacada: 'Del iPhone 13 al iPhone 16 Pro',\n        items: ['Equipos con garantía Apple', 'Entrega programada, definida por sorteo', 'También financiamos teléfonos Android'],\n        boton: 'Quiero entrar al Susu de iPhone', aria: 'Escribir por WhatsApp por el Susu de iPhone',\n        href: this.wa('Hola Nexus Dinamys, vengo de la web. Quiero entrar al Susu de iPhone. El modelo que me interesa es el iPhone ____. ¿Cuál es la cuota quincenal y cuántos cupos quedan?') },\n    ];\n    const prods = ['Electrodoméstico', 'Moto KADI', 'Teléfono'];\n    const rangos = ['Hasta $25', '$25 a $50', 'Más de $50'];\n    const mk = (list, key) => list.map((label) => ({\n      label, sel: this.state[key] === label,\n      borde: this.state[key] === label ? 'var(--accent-line)' : 'var(--border)',\n      fondo: this.state[key] === label ? 'color-mix(in srgb, var(--accent-line) 16%, var(--surface))' : 'var(--surface)',\n      pick: () => this.setState({ [key]: label }),\n    }));\n    const lineas = {\n      'Electrodoméstico|Hasta $25': 'Con hasta $25 por quincena puedes empezar por electrodomésticos pequeños y sumar más artículos al mismo plan. Te decimos cuáles entran en ese rango.',\n      'Electrodoméstico|$25 a $50': 'Con $25 a $50 por quincena entras a lavadoras, cocinas y combos de varios artículos pequeños en un mismo plan. Te confirmamos cuáles calzan.',\n      'Electrodoméstico|Más de $50': 'Con más de $50 por quincena puedes optar por neveras, congeladores y cocinas Daewoo, o llevar varios artículos a la vez. Te pasamos las opciones.',\n      'Moto KADI|Hasta $25': 'La moto KADI se paga por mes: $135 con inicial de $500. Si por quincena reúnes hasta $25, revisamos contigo si el plan te calza o por dónde empezar.',\n      'Moto KADI|$25 a $50': 'Con $25 a $50 por quincena reúnes cerca de la cuota mensual de $135 de la moto KADI. Te confirmamos requisitos y si hay cupos esta semana.',\n      'Moto KADI|Más de $50': 'Con más de $50 por quincena la cuota de $135 al mes de la moto KADI te queda cómoda. Pregunta por los cupos de esta semana.',\n      'Teléfono|Hasta $25': 'Con hasta $25 por quincena te decimos qué modelos de teléfono entran en ese rango, incluyendo opciones Android como Infinix.',\n      'Teléfono|$25 a $50': 'Con $25 a $50 por quincena tienes opciones dentro del Susu de iPhone y en teléfonos Android. Te confirmamos modelos y cupos.',\n      'Teléfono|Más de $50': 'Con más de $50 por quincena puedes apuntar a los iPhone más recientes del Susu. Te decimos la cuota exacta por modelo.',\n    };\n    const prodTxt = { 'Electrodoméstico': 'un electrodoméstico', 'Moto KADI': 'una moto KADI', 'Teléfono': 'un teléfono' };\n    const rangoTxt = { 'Hasta $25': 'hasta $25', '$25 a $50': 'entre $25 y $50', 'Más de $50': 'más de $50' };\n    const resultadoVisible = !!(producto && rango);\n    return {\n      botonFlotante: this.props.botonFlotante ?? true,\n      isDark, themeIcon: isDark ? '☀' : '☾',\n      flotanteOpacidad: ctaZona ? '0' : '1', flotanteVis: ctaZona ? 'hidden' : 'visible',\n      paletaSwitcher: temaSwitcher,\n      paletas: [\n        { id: 'oro', nombre: 'Oro y tinta', c1: '#C39A2B', c2: '#0E1B2B' },\n        { id: 'vinotinto', nombre: 'Vinotinto', c1: '#A63A50', c2: '#33121F' },\n        { id: 'petroleo', nombre: 'Azul petróleo', c1: '#2E8CA1', c2: '#0B242E' },\n      ].map((x) => ({ ...x, sel: paleta === x.id, aria: 'Paleta ' + x.nombre,\n        borde: paleta === x.id ? 'var(--accent-line)' : 'var(--border)',\n        pick: () => this.applyPalette(x.id, true) })),\n      toggleTheme: () => this.applyTheme(isDark ? 'light' : 'dark', true),\n      waGeneral,\n      waRequisitos: this.wa('Hola Nexus Dinamys, vengo de la web. Ya tengo cédula, RIF vigente, referencia personal y referencia bancaria. Quiero empezar mi solicitud.'),\n      waFaq: this.wa('Hola Nexus Dinamys, vengo de la web. Leí las preguntas frecuentes y tengo una duda adicional sobre mi plan.'),\n      razones: [\n        { titulo: 'Contrato firmado', texto: 'Cada plan se respalda con un contrato. No es un acuerdo de palabra por mensaje directo.' },\n        { titulo: 'Cuotas quincenales', texto: 'Pagas de a poco, en fechas fijas, sin descapitalizarte de golpe.' },\n        { titulo: 'Cotizado a tasa BCV', texto: 'Sabes con qué tasa se calcula tu cuota antes de firmar. En motos, la referencia es tasa euro.' },\n        { titulo: 'Entregas reales, documentadas', texto: 'Publicamos cada entrega con su cliente desde marzo de 2025. Míralas más abajo.' },\n      ],\n      planes,\n      opcionesProducto: mk(prods, 'producto'),\n      opcionesRango: mk(rangos, 'rango'),\n      resultadoVisible, resultadoOculto: !resultadoVisible,\n      resultadoLinea: resultadoVisible ? lineas[producto + '|' + rango] : '',\n      resultadoHref: resultadoVisible ? this.wa('Hola Nexus Dinamys, vengo de la web. Quiero estrenar ' + prodTxt[producto] + ' y puedo pagar ' + rangoTxt[rango] + ' por quincena. ¿Qué plan me conviene?') : waGeneral,\n      requisitos: [\n        { titulo: 'Para participar por productos', items: ['Fotocopia de la cédula de identidad', 'Fotocopia del RIF vigente', 'Una referencia personal (que no sea familiar)', 'Una referencia bancaria', 'La primera cuota del o los artículos que quieres'] },\n        { titulo: 'Para participar por motos', items: ['Ser mayor de edad', 'Fotocopia de la cédula de identidad', 'Fotocopia del RIF vigente', 'Una referencia personal (que no sea familiar)', 'Una referencia bancaria', 'Cancelar los gastos administrativos — [DATO FALTANTE: monto]'] },\n      ],\n      galeria: [\n        { grupo: 'Electrodomésticos',\n          fotos: [\n            { id: 'foto-congelador', placeholder: 'Foto real: señora con caja de congelador 3.5 cu.ft.', pie: 'Congelador de 3.5 pies entregado en el centro de Carúpano' },\n            { id: 'foto-seis-articulos', placeholder: 'Foto real: clienta con seis electrodomésticos apilados', pie: 'Seis artículos entregados en un solo plan' },\n            { id: 'foto-cocina-daewoo', placeholder: 'Foto real: clienta con cocina Daewoo de 20\"', pie: 'Cocina Daewoo de 20 pulgadas entregada en casa de la clienta' },\n            { id: 'foto-lavadora', placeholder: 'Foto real: entrega de lavadora con Cooperativa Urbáez', pie: 'Lavadora entregada en alianza con la Cooperativa Urbáez' },\n          ],\n          boton: 'Quiero mi electrodoméstico →', aria: 'Escribir por WhatsApp tras ver las entregas de electrodomésticos',\n          href: this.wa('Hola Nexus Dinamys, vi las entregas de electrodomésticos en la web y quiero el mío.') },\n        { grupo: 'Motos KADI',\n          fotos: [{ id: 'foto-moto-kadi', placeholder: 'Foto real: clienta sobre moto KADI amarilla con su carpeta', pie: 'Clienta recibiendo su moto KADI 0 km con su carpeta de documentos' }],\n          boton: 'Quiero mi moto →', aria: 'Escribir por WhatsApp tras ver las entregas de motos',\n          href: this.wa('Hola Nexus Dinamys, vi las entregas de motos en la web y quiero la mía.') },\n        { grupo: 'Teléfonos',\n          fotos: [{ id: 'foto-infinix', placeholder: 'Foto real: clienta estrenando su teléfono Infinix', pie: 'Clienta estrenando su teléfono Infinix' }],\n          boton: 'Quiero mi teléfono →', aria: 'Escribir por WhatsApp tras ver las entregas de teléfonos',\n          href: this.wa('Hola Nexus Dinamys, vi las entregas de teléfonos en la web y quiero el mío.') },\n      ],\n      faqs: [\n        { p: '¿Cómo funcionan las cuotas quincenales?', r: 'Pagas una cuota fija cada quince días, en fechas acordadas al firmar. Así el producto se paga poco a poco sin descapitalizarte.' },\n        { p: '¿Con qué tasa calculan mi cuota?', r: 'Los planes de electrodomésticos y teléfonos se cotizan a tasa BCV. El plan de moto KADI usa como referencia la tasa euro. Te mostramos el cálculo antes de firmar.' },\n        { p: '¿Cuándo recibo mi producto?', r: 'En moto KADI la entrega puede darse en tan poco como 2 días tras la aprobación. En electrodomésticos y teléfonos la entrega es programada y el orden se define por sorteo entre los participantes del grupo.' },\n        { p: '¿Esto es legal? ¿Hay contrato?', r: 'Sí. Todo plan se respalda con la firma de un contrato entre INVERSIONES NEXUS DYNAMIS C.A. y el cliente.' },\n        { p: '¿Qué garantía tienen los equipos?', r: 'Los iPhone se entregan con garantía Apple. [DATO FALTANTE: garantía de electrodomésticos y de motos KADI]' },\n        { p: '¿Puedo llevar varios artículos a la vez?', r: 'Sí. Puedes incluir más de un artículo en el mismo plan; la primera cuota corresponde al o los artículos que elijas.' },\n        { p: '¿Atienden solo en Carúpano?', r: 'Nuestra oficina está en Carúpano, municipio Bermúdez, estado Sucre. [DATO FALTANTE: si atienden clientes de otras ciudades del estado y si hacen entregas fuera de Carúpano]' },\n        { p: '¿Necesito ser cliente de algún banco en particular?', r: 'Solo pedimos una referencia bancaria; no exigimos un banco específico.' },\n      ],\n    };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"
